name: G8 Niche Context Research

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'

permissions:
  contents: write

concurrency:
  group: g10-live-data-collection
  cancel-in-progress: false
  queue: max

jobs:
  collect-context:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'requests>=2.31.0'
      - name: Collect qualified context
        id: collect
        continue-on-error: true
        run: python collect_niche_context.py
      - name: Publish research cache and prospective history
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          for file in research_data/niche_context.json research_data/niche_ecb_est.csv research_data/niche_context_status.json research_data/niche_context_vintages.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update niche research context [skip ci]"
            git push
          fi
      - name: Report collector failure
        if: ${{ steps.collect.outcome == 'failure' }}
        run: exit 1
