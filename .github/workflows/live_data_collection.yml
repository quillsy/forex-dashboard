name: G8 Live Data Collection

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'live_data.py'
      - 'provider_transport.py'
      - 'official_macro.py'
      - 'official_inflation.py'
      - 'official_ons.py'
      - 'official_hicp.py'
      - 'official_quarterly_labour.py'
      - 'official_yields.py'
      - 'source_contracts.py'
      - 'run_data_collection.py'
      - 'collector_preflight.py'
      - 'bis_research.py'
      - 'collect_research.py'
      - 'ec_industry_research.py'
      - 'collect_ec_industry.py'
      - 'research_vintages.py'
      - '.github/workflows/live_data_collection.yml'
  schedule:
    # Run once daily at 22:00 UTC (after market close)
    - cron: '0 22 * * *'
    # More start attempts compensate for delayed/missed GitHub schedule events.
    # The preflight below still limits provider collection to roughly 30 minutes.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      dispatch_mode:
        description: 'Choose manual for an operator run; watchdog requires a validated UTC slot'
        required: true
        type: choice
        options:
          - manual
          - watchdog
      watchdog_slot_utc:
        description: 'Optional UTC schedule slot for an independent watchdog (YYYY-MM-DDTHH:MM:SS.000Z)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: g10-live-data-collection
  cancel-in-progress: false
  queue: max

jobs:
  collect-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check scheduled collector freshness
        id: preflight
        env:
          FX_WORKFLOW_EVENT: ${{ github.event_name }}
          FX_WORKFLOW_SCHEDULE: ${{ github.event.schedule }}
          FX_DISPATCH_MODE: ${{ inputs.dispatch_mode }}
          FX_WATCHDOG_SLOT: ${{ inputs.watchdog_slot_utc }}
        run: python collector_preflight.py

      - name: Persist provider attempt before any provider requests
        id: provider_reservation
        if: steps.preflight.outputs.run_collector == 'true'
        run: |
          python -B - <<'PY'
          from datetime import datetime, timezone
          from run_data_collection import update_daily_markers
          mode = "${{ steps.preflight.outputs.collector_mode }}"
          update_daily_markers(datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), {}, mode != "daily",
                               reserve_provider_attempt=True)
          PY
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -- daily_collection_status.json
          if git diff --cached --quiet; then
            echo "No new durable provider attempt; refusing provider requests."
            exit 1
          fi
          git commit -m "Reserve collector provider attempt [skip ci]"
          git push

      - name: Set up Python
        if: steps.provider_reservation.outcome == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        if: steps.provider_reservation.outcome == 'success'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run data collection script
        if: steps.provider_reservation.outcome == 'success'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FCS_API_KEY: ${{ secrets.FCS_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          STATS_NZ_API_KEY: ${{ secrets.STATS_NZ_API_KEY }}
          OCP_APIM_SUBSCRIPTION_KEY: ${{ secrets.OCP_APIM_SUBSCRIPTION_KEY }}
        run: |
          if [ "${{ steps.preflight.outputs.collector_mode }}" = "daily" ]; then
            python run_data_collection.py
          else
            python run_data_collection.py --live-only
          fi

      - name: Collect separate BIS research observation when due
        if: ${{ always() && steps.provider_reservation.outcome == 'success' }}
        continue-on-error: true
        run: python collect_research.py

      - name: Collect separate EA21 research observation when due
        if: ${{ always() && steps.provider_reservation.outcome == 'success' }}
        continue-on-error: true
        run: python collect_ec_industry.py

      - name: Commit and push changes
        if: ${{ always() && steps.provider_reservation.outcome == 'success' }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          for file in live_signals.json live_core_data.json data_collection_status.json daily_collection_status.json .eodhd_bonds_cache.json .eodhd_events_cache.json .eodhd_status.json .policy_rates_cache.json research_data/bis_nz_policy.json research_data/status.json research_data/ec_industry.json research_data/ec_industry_status.json research_data/bis_nz_policy_vintages.json research_data/ec_industry_vintages.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: G8 live data [skip ci]"
            git push
          fi
