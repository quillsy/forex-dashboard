name: G8 Live Data Collection

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'live_data.py'
      - 'provider_transport.py'
      - 'official_macro.py'
      - 'official_inflation.py'
      - 'official_ons.py'
      - 'official_hicp.py'
      - 'official_yields.py'
      - 'source_contracts.py'
      - 'run_data_collection.py'
      - '.github/workflows/live_data_collection.yml'
  schedule:
    # Run once daily at 22:00 UTC (after market close)
    - cron: '0 22 * * *'
    - cron: '17,47 * * * *'
  workflow_dispatch:
    # Enable manual run trigger

permissions:
  contents: write

concurrency:
  group: g10-live-data-collection
  cancel-in-progress: false

jobs:
  collect-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run data collection script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FCS_API_KEY: ${{ secrets.FCS_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          STATS_NZ_API_KEY: ${{ secrets.STATS_NZ_API_KEY }}
          OCP_APIM_SUBSCRIPTION_KEY: ${{ secrets.OCP_APIM_SUBSCRIPTION_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            python run_data_collection.py
          else
            python run_data_collection.py --live-only
          fi

      - name: Commit and push changes
        if: ${{ always() }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          for file in live_signals.json live_core_data.json data_collection_status.json .eodhd_bonds_cache.json .eodhd_events_cache.json .eodhd_status.json .policy_rates_cache.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: G8 live data [skip ci]"
            git push
          fi
