name: G10 Live Data Collection

on:
  schedule:
    # Run once daily at 22:00 UTC (after market close)
    - cron: '0 22 * * *'
  workflow_dispatch:
    # Enable manual run trigger

permissions:
  contents: write

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run data collection script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          STOCKDATA_API_KEY: ${{ secrets.STOCKDATA_API_KEY }}
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ITICK_API_KEY: ${{ secrets.ITICK_API_KEY }}
          FCS_API_KEY: ${{ secrets.FCS_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          python run_data_collection.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add live_signals.json data_collection_status.json
          git commit -m "Auto-update: G10 Live Signal Snapshots & Outcomes [skip ci]" || echo "No changes to commit"
          git push
