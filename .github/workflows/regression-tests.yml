name: Dashboard regression tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regressions
        run: python -m unittest -v test_core_regressions test_policy_regressions test_eodhd_regressions test_snapshot_regressions test_ui_regressions test_free_sources test_official_macro test_official_bea test_official_nz_gdp test_official_japan_gdp test_official_yields test_source_contracts test_live_data test_official_inflation test_official_ons test_official_hicp test_official_quarterly_labour test_provider_retry test_live_labour_ui test_live_context_ui test_live_view_refresh test_collector_fallback test_bis_research test_research_collection test_research_panel test_ec_industry_research test_ec_industry_collection test_research_vintages
