name: G8 MoF Weekly Research Context

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1-5'

permissions:
  contents: write

concurrency:
  group: g10-live-data-collection
  cancel-in-progress: false
  queue: max

jobs:
  collect-mof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'requests>=2.31.0'
      - name: Collect MoF research context
        id: collect
        continue-on-error: true
        run: python collect_mof_context.py
      - name: Publish MoF cache and prospective history
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          for file in research_data/mof_week.csv research_data/mof_context.json research_data/mof_context_status.json research_data/mof_context_vintages.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update MoF research context [skip ci]"
            git push
          fi
      - name: Report collector failure
        if: ${{ steps.collect.outcome == 'failure' }}
        run: exit 1
