name: G8 MoF Weekly Research Context

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1-5'

permissions:
  contents: write

concurrency:
  group: g10-live-data-collection
  cancel-in-progress: false
  queue: max

jobs:
  collect-mof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'requests>=2.31.0'
      - name: Reserve, collect and publish MoF research context
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          python collect_mof_context.py --publish
